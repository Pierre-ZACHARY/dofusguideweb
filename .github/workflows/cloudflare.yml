name: Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: aaf857a57ff01f7b5c961b37053782e1
  DOMAIN_NAME: dofusguideweb.com
  GOOGLE_CLIENT_ID: 559765229314-g71qdbv43se29qv3hnpfr9vnsd648ra5.apps.googleusercontent.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  METAMOB_CREDENTIALS_KEY: ${{ secrets.METAMOB_CREDENTIALS_KEY }}

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Use stable npm version
        run: npm install --global npm@11.19.0

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install infrastructure dependencies
        working-directory: infra
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: |
          npm run typecheck
          npm test -- --run

      - name: Validate infrastructure
        working-directory: infra
        run: npm run typecheck

      - name: Deploy Cloudflare infrastructure and application
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: ${{ vars.PULUMI_STACK_NAME || 'Pierre-ZACHARY/dofusguideweb-cloudflare/dev' }}
          work-dir: infra
          cloud-url: https://api.pulumi.com
          refresh: true
          comment-on-summary: true
